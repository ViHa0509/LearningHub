# Which roadmap.sh nodes feed each app node's References (links only; see openspec spec node-resources).
# Only our node ids and roadmap.sh slugs live here: synced titles and URLs stay in the local database.
# "<roadmap>/<slug>" matches every file <slug>@*.md of that roadmap; "<roadmap>/*" takes the whole roadmap.
