# Render Blueprint: Learning Hub as one free Docker web service (API + built app).
# Database: Supabase Postgres (Session pooler). Note files: Supabase Storage bucket.
# Values marked sync: false are secrets: enter them in Render's dashboard, never here.
services:
  - type: web
    name: learninghub
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # postgresql+psycopg://postgres.<ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
      - key: LH_DATABASE_URL
        sync: false
      # Keep it fixed: it decrypts the provider keys saved in the app.
      - key: LH_SECRET_KEY
        sync: false
      - key: LH_STORAGE_BACKEND
        value: supabase
      - key: LH_SUPABASE_URL
        value: https://bpvmjavtbjvpudopltzx.supabase.co
      # Supabase -> Project Settings -> API keys -> service_role (server only)
      - key: LH_SUPABASE_SERVICE_KEY
        sync: false
      - key: LH_SUPABASE_BUCKET
        value: learninghub
      - key: LH_PUBLIC_URL
        value: https://learninghub.vihc0509.workers.dev
      - key: LH_FORWARDED_ALLOW_IPS
        value: "*"
