name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs the same checks before it builds the image.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PGPASSWORD: learninghub

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: learninghub
          POSTGRES_PASSWORD: learninghub
          POSTGRES_DB: learninghub
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U learninghub -d learninghub"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - name: Create the test databases
        run: psql -h localhost -p 5434 -U learninghub -d learninghub -f ../docker/db-init/01-test-db.sql
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        run: python -m venv .venv && .venv/bin/pip install -r requirements-dev.txt
      - name: Tests
        run: .venv/bin/python -m pytest
      - name: Lint
        run: .venv/bin/ruff check . && .venv/bin/ruff format --check .
      - name: Types
        run: .venv/bin/mypy app

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build and types
        run: npm run build

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: learninghub
          POSTGRES_PASSWORD: learninghub
          POSTGRES_DB: learninghub
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U learninghub -d learninghub"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - name: Create the test databases
        run: psql -h localhost -p 5434 -U learninghub -d learninghub -f docker/db-init/01-test-db.sql
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install backend
        working-directory: backend
        run: python -m venv .venv && .venv/bin/pip install -r requirements-dev.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend and Edge
        working-directory: frontend
        # The runner image ships Edge; installing it again needs the apt mirrors, which fail at times.
        run: |
          npm ci
          if command -v microsoft-edge-stable >/dev/null; then
            microsoft-edge-stable --version
          else
            npx playwright install --with-deps msedge
          fi
      - name: E2E
        working-directory: frontend
        run: npm run e2e
      - name: Keep screenshots and report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-results
          path: |
            frontend/e2e-results/
            frontend/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  # Production: migrate the database, then ask Vercel to build and publish main.
  # Vercel's own Git deploy for main is off, so the app never runs ahead of its schema.
  deploy:
    needs: [backend, frontend, e2e]
    # A release run calls this file on a tag push (ref refs/tags/...), so the ref check keeps it out.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One deploy at a time, and never cancel a migration that is already running.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: backend
    steps:
      # Secrets cannot be used in a job-level "if"; this step turns them into an output.
      - name: Check the deploy secrets
        id: secrets
        env:
          MIGRATE_URL: ${{ secrets.LH_MIGRATE_DATABASE_URL }}
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$MIGRATE_URL" ] && [ -n "$DEPLOY_HOOK" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Deploy secrets are not set; skipping the production deploy."
          fi
      - uses: actions/checkout@v5
        if: steps.secrets.outputs.enabled == 'true'
      - uses: actions/setup-python@v6
        if: steps.secrets.outputs.enabled == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install backend runtime requirements
        if: steps.secrets.outputs.enabled == 'true'
        run: python -m venv .venv && .venv/bin/pip install -r requirements.txt
      - name: Migrate the production database
        if: steps.secrets.outputs.enabled == 'true'
        env:
          LH_DATABASE_URL: ${{ secrets.LH_MIGRATE_DATABASE_URL }}
        run: .venv/bin/alembic upgrade head
      # No "always()" or "failure()" here: a failed migration fails the job and this step never runs.
      - name: Trigger the Vercel deploy
        if: steps.secrets.outputs.enabled == 'true'
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: curl --fail -sS -X POST "$VERCEL_DEPLOY_HOOK_URL" > /dev/null
