name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs the same checks before it builds the image.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PGPASSWORD: learninghub

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: learninghub
          POSTGRES_PASSWORD: learninghub
          POSTGRES_DB: learninghub
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U learninghub -d learninghub"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - name: Create the test databases
        run: psql -h localhost -p 5434 -U learninghub -d learninghub -f ../docker/db-init/01-test-db.sql
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        run: python -m venv .venv && .venv/bin/pip install -r requirements-dev.txt
      - name: Tests
        run: .venv/bin/python -m pytest
      - name: Lint
        run: .venv/bin/ruff check . && .venv/bin/ruff format --check .
      - name: Types
        run: .venv/bin/mypy app

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build and types
        run: npm run build

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: learninghub
          POSTGRES_PASSWORD: learninghub
          POSTGRES_DB: learninghub
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U learninghub -d learninghub"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - name: Create the test databases
        run: psql -h localhost -p 5434 -U learninghub -d learninghub -f docker/db-init/01-test-db.sql
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install backend
        working-directory: backend
        run: python -m venv .venv && .venv/bin/pip install -r requirements-dev.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend and Edge
        working-directory: frontend
        # The runner image ships Edge; installing it again needs the apt mirrors, which fail at times.
        run: |
          npm ci
          if command -v microsoft-edge-stable >/dev/null; then
            microsoft-edge-stable --version
          else
            npx playwright install --with-deps msedge
          fi
      - name: E2E
        working-directory: frontend
        run: npm run e2e
      - name: Keep screenshots and report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-results
          path: |
            frontend/e2e-results/
            frontend/playwright-report/
          retention-days: 14
          if-no-files-found: ignore
